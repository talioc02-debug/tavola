<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TAVOLA! Gamified English for restaurant service - Tri-Language Teaching Academy">
<meta name="theme-color" content="#43C059">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TAVOLA!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>TAVOLA! — English for Restaurant Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#43C059; --green-edge:#2C9440;
  --tomato:#FF7A33; --tomato-edge:#D2551A;
  --yellow:#FFC42E; --yellow-edge:#DC9F00;
  --grape:#A566FF; --grape-edge:#7A3CD6;
  --sky:#22B8E0; --sky-edge:#1590B4;
  --rose:#FF5C7A; --rose-edge:#D22F50;
  --ink:#3B2A20; --ink-soft:#7A6357;
  --bg:#FFF8EF; --bg-2:#FFEFDC; --card:#FFFFFF; --line:#E7D8C6;
  --locked:#D9CBBC; --locked-edge:#BBAA99;
  --shadow:0 6px 0; --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#FFF3E4; --ink-soft:#C8B3A3;
    --bg:#1B1410; --bg-2:#241A14; --card:#2B211A; --line:#46372D;
    --locked:#3B2E26; --locked-edge:#2A211B;
  }
}
:root[data-theme="dark"]{
  --ink:#FFF3E4; --ink-soft:#C8B3A3;
  --bg:#1B1410; --bg-2:#241A14; --card:#2B211A; --line:#46372D;
  --locked:#3B2E26; --locked-edge:#2A211B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Nunito,"Trebuchet MS",system-ui,sans-serif; font-weight:700;
  font-size:17px; line-height:1.45; overflow-x:hidden;
}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,sans-serif; font-weight:600; letter-spacing:.3px; margin:0}
button{font-family:inherit; font-weight:800; color:inherit}
:focus-visible{outline:4px solid var(--sky); outline-offset:3px; border-radius:14px}

/* ---------- chunky button ---------- */
.btn{
  border:3px solid var(--ink); border-radius:999px; padding:14px 26px;
  font-size:17px; cursor:pointer; background:var(--card); color:var(--ink);
  box-shadow:var(--shadow) var(--line); transform:translateY(0);
  transition:transform .06s ease, box-shadow .06s ease, filter .15s ease;
  display:inline-flex; align-items:center; gap:10px; justify-content:center;
  min-height:54px; user-select:none;
}
.btn:active{transform:translateY(5px); box-shadow:0 1px 0 var(--line)}
.btn.green{background:var(--green); box-shadow:var(--shadow) var(--green-edge); color:#12220F}
.btn.green:active{box-shadow:0 1px 0 var(--green-edge)}
.btn.tomato{background:var(--tomato); box-shadow:var(--shadow) var(--tomato-edge); color:#331100}
.btn.tomato:active{box-shadow:0 1px 0 var(--tomato-edge)}
.btn.grape{background:var(--grape); box-shadow:var(--shadow) var(--grape-edge); color:#1D0B33}
.btn.grape:active{box-shadow:0 1px 0 var(--grape-edge)}
.btn.sky{background:var(--sky); box-shadow:var(--shadow) var(--sky-edge); color:#04252E}
.btn.sky:active{box-shadow:0 1px 0 var(--sky-edge)}
.btn.yellow{background:var(--yellow); box-shadow:var(--shadow) var(--yellow-edge); color:#3A2600}
.btn.yellow:active{box-shadow:0 1px 0 var(--yellow-edge)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; box-shadow:var(--shadow) var(--line)}
.btn.big{width:100%; font-size:19px; padding:16px 26px; min-height:62px}
.btn.ghost{background:transparent; border-color:var(--line); box-shadow:none; color:var(--ink-soft)}
.btn.tiny{padding:8px 16px; min-height:42px; font-size:14px; box-shadow:0 4px 0 var(--line)}

/* ---------- layout ---------- */
.wrap{max-width:820px; margin:0 auto; padding:0 16px 140px}
.topbar{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:3px solid var(--line); padding:10px 16px;
}
.topbar .inner{max-width:820px; margin:0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.stat{display:flex; align-items:center; gap:6px; font-size:16px; font-weight:800; white-space:nowrap}
.stat .num{font-family:Fredoka}
.wordmark{display:flex; align-items:center; gap:8px; margin-right:auto; cursor:pointer; background:none; border:0; padding:0}

/* ---------- cards ---------- */
.card{
  background:var(--card); border:3px solid var(--line); border-radius:var(--radius);
  padding:18px; box-shadow:0 6px 0 var(--line);
}
.card.flat{box-shadow:none}
.pill{
  display:inline-flex; align-items:center; gap:6px; border-radius:999px;
  padding:5px 14px; font-size:13px; font-weight:800; border:3px solid transparent;
}

/* ---------- path ---------- */
.unitbar{
  border-radius:20px; padding:14px 18px; color:#fff; border:3px solid var(--ink);
  display:flex; align-items:center; gap:14px; box-shadow:0 6px 0 rgba(0,0,0,.25); margin:26px 0 6px;
}
.path{display:flex; flex-direction:column; align-items:center; gap:4px; position:relative}
.node{
  width:92px; height:86px; border-radius:50%/46%; border:4px solid var(--ink);
  display:grid; place-items:center; cursor:pointer; position:relative;
  box-shadow:0 9px 0 var(--nedge, var(--green-edge)); background:var(--ncol, var(--green));
  transition:transform .08s ease, box-shadow .08s ease;
}
.node:active{transform:translateY(7px); box-shadow:0 2px 0 var(--nedge, var(--green-edge))}
.node.locked{background:var(--locked); box-shadow:0 9px 0 var(--locked-edge); cursor:not-allowed}
.node.locked:active{transform:none; box-shadow:0 9px 0 var(--locked-edge)}
.node .emoji{font-size:38px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.node .crowns{position:absolute; bottom:-14px; background:var(--card); border:3px solid var(--line);
  border-radius:999px; font-size:12px; padding:1px 9px; white-space:nowrap}
.nodewrap{display:flex; align-items:center; gap:14px; padding:14px 0}
.nodelabel{max-width:230px; font-size:15px; color:var(--ink-soft)}
.nodelabel b{display:block; color:var(--ink); font-size:17px; font-family:Fredoka; font-weight:600}
.bounce{animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.startflag{
  position:absolute; top:-18px; left:50%; transform:translateX(-50%);
  background:var(--card); border:3px solid var(--line); border-radius:999px;
  padding:2px 12px; font-size:12px; color:var(--ink-soft); white-space:nowrap
}

/* ---------- progress ---------- */
.bar{height:22px; border-radius:999px; background:var(--line); overflow:hidden; border:3px solid var(--ink); flex:1}
.bar > div{height:100%; background:var(--green); border-radius:999px; transition:width .35s cubic-bezier(.3,1.4,.5,1);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12), inset 0 6px 0 rgba(255,255,255,.35)}
.xpbar{height:14px; border-radius:999px; background:var(--line); overflow:hidden; border:2px solid var(--ink)}
.xpbar > div{height:100%; background:var(--yellow)}

/* ---------- exercise ---------- */
.choice{
  width:100%; text-align:left; background:var(--card); border:3px solid var(--line);
  border-radius:18px; padding:14px 18px; font-size:17px; cursor:pointer;
  box-shadow:0 5px 0 var(--line); transition:transform .06s, box-shadow .06s, background .12s, border-color .12s;
  display:flex; gap:12px; align-items:center;
}
.choice:active{transform:translateY(4px); box-shadow:0 1px 0 var(--line)}
.choice.sel{border-color:var(--sky); background:color-mix(in srgb, var(--sky) 16%, var(--card)); box-shadow:0 5px 0 var(--sky-edge)}
.choice.ok{border-color:var(--green); background:color-mix(in srgb, var(--green) 20%, var(--card)); box-shadow:0 5px 0 var(--green-edge)}
.choice.no{border-color:var(--rose); background:color-mix(in srgb, var(--rose) 18%, var(--card)); box-shadow:0 5px 0 var(--rose-edge)}
.key{width:30px; height:30px; flex:0 0 30px; border:3px solid var(--line); border-radius:9px;
  display:grid; place-items:center; font-size:13px; color:var(--ink-soft)}
.chip{
  border:3px solid var(--line); border-radius:999px; padding:9px 18px; background:var(--card);
  box-shadow:0 5px 0 var(--line); cursor:pointer; font-size:16px; font-weight:800;
}
.chip:active{transform:translateY(4px); box-shadow:0 1px 0 var(--line)}
.chip.used{opacity:.3; pointer-events:none}
.blank{
  display:inline-block; min-width:120px; border-bottom:4px solid var(--sky);
  text-align:center; padding:0 8px; color:var(--sky); font-weight:800;
}
.footerbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50; border-top:3px solid var(--line);
  background:var(--bg); padding:14px 16px calc(14px + env(safe-area-inset-bottom));
}
.footerbar .inner{max-width:820px; margin:0 auto; display:flex; gap:14px; align-items:center}
.verdict{border-radius:20px 20px 0 0; padding:16px; margin:-14px -16px 12px; border-top:3px solid}
.verdict.ok{background:color-mix(in srgb, var(--green) 22%, var(--bg)); border-color:var(--green)}
.verdict.no{background:color-mix(in srgb, var(--rose) 20%, var(--bg)); border-color:var(--rose)}
.speech{
  position:relative; background:var(--card); border:3px solid var(--line); border-radius:20px; padding:14px 16px;
}
.speech:after{content:""; position:absolute; left:-12px; top:22px; width:20px; height:20px;
  background:var(--card); border-left:3px solid var(--line); border-bottom:3px solid var(--line);
  transform:rotate(45deg); border-radius:0 0 0 6px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.slidein{animation:slidein .3s ease both}
@keyframes slidein{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:90}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:1fr 1fr}
@media (max-width:520px){ .g2{grid-template-columns:1fr} .node{width:80px;height:76px} .wrap{padding-bottom:150px} }
.badge{
  display:grid; place-items:center; gap:6px; text-align:center; padding:14px 8px;
  border:3px solid var(--line); border-radius:20px; background:var(--card); font-size:12px;
}
.badge.off{opacity:.38; filter:grayscale(1)}
.badge .ico{font-size:34px}
.row{display:flex; align-items:center; gap:12px}
.muted{color:var(--ink-soft); font-weight:600}
.small{font-size:14px}
table.pb{width:100%; border-collapse:collapse; font-size:15px}
table.pb th,table.pb td{border:2px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top}
table.pb th{background:var(--bg-2); font-family:Fredoka; font-weight:600}
.aibox{border:3px dashed var(--grape); border-radius:20px; padding:14px; background:color-mix(in srgb, var(--grape) 8%, var(--card))}
.bubble{border:3px solid var(--line); border-radius:20px; padding:10px 14px; margin:8px 0; max-width:86%}
.bubble.me{margin-left:auto; background:color-mix(in srgb, var(--sky) 18%, var(--card)); border-color:var(--sky)}
.bubble.guest{background:var(--card)}
input[type=text],textarea,select{
  font-family:inherit; font-weight:700; font-size:16px; color:var(--ink); background:var(--card);
  border:3px solid var(--line); border-radius:16px; padding:12px 14px; width:100%;
}
.printonly{display:none}
@media print{
  .topbar,.footerbar,.btn,.node,#confetti,.noprint,.choice,.chip{display:none !important}
  .printonly{display:block !important}
  body{background:#fff; color:#000; font-size:12pt}
  .card{box-shadow:none; border-color:#999; break-inside:avoid}
  table.pb th,table.pb td{border-color:#999}
  .answerkey{display:none !important}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div id="root"><div style="padding:40px;text-align:center;font-family:sans-serif">Loading TAVOLA!…</div></div>
<canvas id="confetti"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
/* ============================================================
   TAVOLA! — English for Restaurant Service
   A gamified learning app for Italian hospitality professionals.
   Tri-Language Teaching Academy
   ============================================================ */
(function(){
"use strict";
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect,
    useRef = React.useRef, useMemo = React.useMemo, useCallback = React.useCallback;

/* ---------------------------------------------------------- DATA */

var LESSONS = [
{
  id:"l1", unit:1, title:"Welcome to the table", it:"Accogliere e far accomodare gli ospiti",
  who:"host", col:"green", icon:"\uD83D\uDEAA", scene:"door",
  phrases:[
    {en:"Good evening! Do you have a reservation?", it:"Buonasera! Avete una prenotazione?"},
    {en:"A table for two?", it:"Un tavolo per due?"},
    {en:"Follow me, please.", it:"Mi segua, prego."},
    {en:"Would you prefer inside or outside?", it:"Preferite dentro o fuori?"},
    {en:"I am afraid we are fully booked.", it:"Purtroppo siamo al completo."},
    {en:"The wait is about fifteen minutes.", it:"L'attesa e di circa quindici minuti."}
  ],
  ex:[
    {t:"mcq", scene:"door", q:"Two guests walk in at 8 pm. What do you say first?",
     it:"Due ospiti entrano alle 20. Cosa dici per primo?",
     opts:["Good evening! Do you have a reservation?","Hello, what do you want?","Yes? Sit down, please.","Good night! You are late."],
     a:0, why:"Greet first, then check the booking. 'Good night' is only for leaving."},
    {t:"gap", scene:"table", q:"Would you like a table ___ the window or near the kitchen?",
     it:"Vicino alla finestra oppure vicino alla cucina?",
     bank:["by","on","in","of"], a:"by",
     why:"We say 'a table by the window' - 'by' means next to."},
    {t:"listen", say:"I am sorry, we are fully booked tonight. The wait is about twenty minutes.",
     q:"What is the situation?",
     opts:["The restaurant is full and the guest must wait about 20 minutes.","The restaurant is closed for twenty minutes.","The kitchen closes in twenty minutes.","The guest booked a table for twenty people."],
     a:0, why:"'Fully booked' = tutto prenotato. 'The wait' = l'attesa."},
    {t:"speak", say:"Good evening! Follow me, please. Your table is ready.",
     it:"Buonasera! Mi segua, prego. Il vostro tavolo e pronto."},
    {t:"match", q:"Match the English with the Italian.",
     pairs:[["Do you have a reservation?","Avete una prenotazione?"],["Follow me, please.","Mi segua, prego."],["We are fully booked.","Siamo al completo."],["Take a seat at the bar.","Si accomodi al bancone."]]}
  ]
},
{
  id:"l2", unit:1, title:"Drinks first", it:"Prendere l'ordine delle bevande",
  who:"waitress", col:"sky", icon:"\uD83E\uDD5B", scene:"drinks",
  phrases:[
    {en:"Can I get you something to drink?", it:"Posso portarvi qualcosa da bere?"},
    {en:"Still or sparkling water?", it:"Acqua naturale o frizzante?"},
    {en:"We have it by the glass or by the bottle.", it:"L'abbiamo al bicchiere o in bottiglia."},
    {en:"Would you like ice with that?", it:"Desidera del ghiaccio?"},
    {en:"I will be right back with your drinks.", it:"Torno subito con le bevande."},
    {en:"Shall I bring some bread while you decide?", it:"Porto del pane mentre decidete?"}
  ],
  ex:[
    {t:"mcq", scene:"drinks", q:"The guest asks for water. Which question do you ask next?",
     it:"L'ospite chiede acqua. Quale domanda fai?",
     opts:["Still or sparkling?","Natural or with gas?","Water normal or water bubbles?","Do you want plain water, no?"],
     a:0, why:"In English restaurants the standard pair is 'still or sparkling'."},
    {t:"gap", scene:"drinks", q:"We have the house red ___ the glass or by the bottle.",
     it:"Abbiamo il rosso della casa al bicchiere o in bottiglia.",
     bank:["by","with","for","at"], a:"by",
     why:"'By the glass / by the bottle' is the fixed expression."},
    {t:"listen", say:"Could I have a sparkling water with no ice, and a glass of the house white, please?",
     q:"What does the guest want?",
     opts:["Sparkling water without ice and a glass of house white wine.","Still water with ice and a bottle of white wine.","Sparkling water with lemon and a beer.","Two glasses of red wine."],
     a:0, why:"'No ice' = senza ghiaccio. 'House white' = vino bianco della casa."},
    {t:"speak", say:"Can I get you something to drink while you look at the menu?",
     it:"Posso portarvi qualcosa da bere mentre guardate il menu?"},
    {t:"order", q:"Put the drinks service in the right order.",
     lines:["Good evening. Can I get you something to drink?","Yes, a sparkling water, please.","Still or sparkling for you, madam?","Still, please. And a glass of red wine.","Of course. I will be right back with your drinks."]}
  ]
},
{
  id:"l3", unit:1, title:"Taking the order", it:"Prendere l'ordinazione",
  who:"waitress", col:"tomato", icon:"\uD83D\uDCDD", scene:"notepad",
  phrases:[
    {en:"Are you ready to order?", it:"Siete pronti per ordinare?"},
    {en:"Would you like a starter?", it:"Desidera un antipasto?"},
    {en:"And for your main course?", it:"E come secondo?"},
    {en:"How would you like your steak?", it:"Come desidera la bistecca?"},
    {en:"Anything else for you?", it:"Altro per lei?"},
    {en:"Let me repeat that back to you.", it:"Le ripeto l'ordine."}
  ],
  ex:[
    {t:"mcq", scene:"notepad", q:"A guest orders a steak. What must you always ask?",
     it:"Un ospite ordina una bistecca. Cosa devi sempre chiedere?",
     opts:["How would you like it cooked?","Do you want it hot?","Is the meat good for you?","How much meat do you eat?"],
     a:0, why:"Rare - medium rare - medium - well done. Always ask."},
    {t:"gap", scene:"notepad", q:"Would you like a starter ___ your main course?",
     it:"Desidera un antipasto prima del secondo?",
     bank:["before","after","under","between"], a:"before",
     why:"The starter comes before the main course."},
    {t:"listen", say:"For me the soup to start, then the grilled sea bass, and a side of roast potatoes.",
     q:"What is the guest's main course?",
     opts:["Grilled sea bass","Soup","Roast potatoes","Grilled steak"],
     a:0, why:"'To start' = the starter. The main course is the sea bass; the potatoes are a side dish."},
    {t:"speak", say:"Are you ready to order, or would you like a few more minutes?",
     it:"Siete pronti per ordinare o desiderate ancora qualche minuto?"},
    {t:"mcq", scene:"notepad", q:"You did not understand the order. What is the politest thing to say?",
     it:"Non hai capito l'ordine. Cosa dici?",
     opts:["Sorry, could you repeat that, please?","What? Again.","I do not understand you.","Speak slowly, please, my English is bad."],
     a:0, why:"'Could you repeat that, please?' is polite and professional."},
    {t:"match", q:"Match the course with the Italian.",
     pairs:[["starter","antipasto"],["main course","secondo"],["side dish","contorno"],["dessert","dolce"]]}
  ]
},
{
  id:"l4", unit:2, title:"Describing the dish", it:"Descrivere i piatti e consigliare",
  who:"chef", col:"yellow", icon:"\uD83D\uDC68\u200D\uD83C\uDF73", scene:"plate",
  phrases:[
    {en:"It is a local speciality.", it:"E una specialita locale."},
    {en:"It comes with roast potatoes and salad.", it:"E servito con patate al forno e insalata."},
    {en:"It is grilled, not fried.", it:"E alla griglia, non fritto."},
    {en:"It is quite rich but not spicy.", it:"E piuttosto ricco ma non piccante."},
    {en:"I would recommend the sea bass.", it:"Le consiglierei il branzino."},
    {en:"It goes really well with a dry white wine.", it:"Si abbina benissimo con un bianco secco."}
  ],
  ex:[
    {t:"mcq", scene:"plate", q:"A guest asks: 'What exactly is trofie al pesto?' Which answer is best?",
     it:"Quale risposta e la migliore?",
     opts:["It is a local speciality: short twisted pasta with basil sauce, potatoes and green beans.","It is pasta with green sauce, very typical, you will like it.","Pasta. Very good. Ligurian.","It is difficult to explain, it is Italian food."],
     a:0, why:"Name the type of dish, then the main ingredients. Short and clear."},
    {t:"gap", scene:"plate", q:"The lamb ___ with roast potatoes and seasonal vegetables.",
     it:"L'agnello e servito con patate e verdure di stagione.",
     bank:["comes","arrives","brings","goes"], a:"comes",
     why:"'It comes with...' = e servito con. 'What does it come with?' is the guest's question."},
    {t:"listen", say:"It is a light dish. The fish is grilled, not fried, and it comes with a green salad.",
     q:"How is the fish cooked?",
     opts:["Grilled","Fried","Boiled","Raw"],
     a:0, why:"grilled = alla griglia; fried = fritto; boiled = bollito."},
    {t:"speak", say:"I would recommend the sea bass. It is grilled and it goes really well with a dry white wine.",
     it:"Le consiglio il branzino. E alla griglia e si abbina bene con un bianco secco."},
    {t:"match", q:"Match the cooking word with the Italian.",
     pairs:[["grilled","alla griglia"],["baked","al forno"],["stuffed","ripieno"],["smoked","affumicato"],["stewed","in umido"]]}
  ]
},
{
  id:"l5", unit:2, title:"Allergies and diets", it:"Allergie, intolleranze e diete",

function levelFor(xp){ var L=1; for(var i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i]) L=i+1; } return L; }
function levelFloor(lv){ return LEVELS[Math.min(lv-1,LEVELS.length-1)]; }

/* ---------------------------------------------------------- ENGINE: storage, streak, speech, confetti */

var KEY = "tavola.v1";
function blankState(){
  return {name:"", xp:0, streak:0, lastDay:"", done:{}, badges:[], heard:0, spoken:0, bossWon:false, bingoWon:false, menuSent:false, joined:todayKey()};
}
function todayKey(){
  var d = new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function yesterdayKey(){
  var d = new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function loadState(){
  try{
    var raw = window.localStorage.getItem(KEY);
    if(!raw) return blankState();
    var o = JSON.parse(raw); var b = blankState();
    for(var k in b){ if(!(k in o)) o[k] = b[k]; }
    return o;
  }catch(e){ return blankState(); }
}
function saveState(st){
  try{ window.localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){}
}

/* ---- text to speech (device voices, chunked, bug-guarded) ---- */
var TTS = {
  voices: [], chosen: null, current: null, queue: [], idx: 0, onstate: null, speaking: false, rate: 0.95
};
var VOICE_RANK = ["Natural","Neural","Online","Google UK English Female","Google UK English Male","Google US English",
  "Microsoft Sonia","Microsoft Ryan","Microsoft Libby","Microsoft Aria","Microsoft Zira","Microsoft David",
  "Microsoft Hazel","Samantha","Karen","Daniel","Moira","Tessa"];
function rankVoice(v){
  for(var i=0;i<VOICE_RANK.length;i++){ if(v.name.indexOf(VOICE_RANK[i])>=0) return i; }
  return 99;
}
function refreshVoices(cb){
  if(!("speechSynthesis" in window)) return;
  var all = window.speechSynthesis.getVoices() || [];
  var en = all.filter(function(v){ return (v.lang||"").toLowerCase().indexOf("en")===0; });
  en.sort(function(a,b){ return rankVoice(a)-rankVoice(b) || a.name.localeCompare(b.name); });
  TTS.voices = en.length ? en : all;
  if(!TTS.chosen && TTS.voices.length) TTS.chosen = TTS.voices[0].name;
  if(cb) cb(TTS.voices.slice());
}
function initVoices(cb){
  refreshVoices(cb);
  if("speechSynthesis" in window){
    window.speechSynthesis.onvoiceschanged = function(){ refreshVoices(cb); };
    [200,600,1200,2500].forEach(function(ms){ setTimeout(function(){ refreshVoices(cb); }, ms); });
  }
}
function chunkText(t){
  var parts = String(t).replace(/\s+/g," ").match(/[^.!?]+[.!?]?/g) || [String(t)];
  var out = [], buf = "";
  parts.forEach(function(p){
    if((buf+p).length > 170 && buf){ out.push(buf.trim()); buf = p; }
    else buf += p;
  });
  if(buf.trim()) out.push(buf.trim());
  return out;
}
function ttsStop(){
  TTS.queue = []; TTS.idx = 0; TTS.speaking = false; TTS.current = null;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(TTS.onstate) TTS.onstate({playing:false, part:0, total:0});
}
function ttsSpeak(text, rate, onDone){
  if(!("speechSynthesis" in window)){ if(onDone) onDone(); return; }
  ttsStop();
  TTS.queue = chunkText(text); TTS.idx = 0; TTS.speaking = true;
  TTS.rate = rate || TTS.rate;
  var voice = null;
  for(var i=0;i<TTS.voices.length;i++){ if(TTS.voices[i].name === TTS.chosen) voice = TTS.voices[i]; }
  function step(){
    if(!TTS.speaking || TTS.idx >= TTS.queue.length){
      TTS.speaking = false;
      if(TTS.onstate) TTS.onstate({playing:false, part:0, total:0});
      if(onDone) onDone();
      return;
    }
    var u = new window.SpeechSynthesisUtterance(TTS.queue[TTS.idx]);
    if(voice){ u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-GB"; }
    u.rate = TTS.rate; u.pitch = 1;
    TTS.current = u;
    if(TTS.onstate) TTS.onstate({playing:true, part:TTS.idx+1, total:TTS.queue.length});
    u.onend = function(){ TTS.idx++; setTimeout(step, 180); };
    u.onerror = function(){ TTS.idx++; setTimeout(step, 180); };
    try{ window.speechSynthesis.speak(u); }catch(e){ TTS.idx++; setTimeout(step,180); }
  }
  setTimeout(step, 70);
}

/* ---- speech recognition ---- */
function recogAvailable(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function normWords(t){
  return String(t).toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean);
}
function scoreSpeech(target, said){
  var A = normWords(target), B = normWords(said), pool = B.slice(), hit = 0;
  A.forEach(function(w){
    var i = pool.indexOf(w);
    if(i>=0){ hit++; pool.splice(i,1); }
    else {
      for(var j=0;j<pool.length;j++){
        if(pool[j].length>3 && w.length>3 && (pool[j].indexOf(w.slice(0,4))===0)){ hit++; pool.splice(j,1); break; }
      }
    }
  });
  return A.length ? Math.round(hit/A.length*100) : 0;
}

/* ---- confetti ---- */
var CONF = {parts:[], raf:0, cv:null, ctx:null};
function confetti(n){
  var cv = document.getElementById("confetti");
  if(!cv) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  CONF.cv = cv; CONF.ctx = cv.getContext("2d");
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  var cols = ["#43C059","#FF7A33","#FFC42E","#A566FF","#22B8E0","#FF5C7A"];
  for(var i=0;i<(n||90);i++){
    CONF.parts.push({
      x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*0.4,
      w: 7+Math.random()*9, hh: 10+Math.random()*12,
      vy: 2.6+Math.random()*3.4, vx: -1.6+Math.random()*3.2,
      rot: Math.random()*6.28, vr: -0.16+Math.random()*0.32,
      c: cols[(Math.random()*cols.length)|0]
    });
  }
  if(!CONF.raf) tickConfetti();
}
function tickConfetti(){
  var ctx = CONF.ctx, cv = CONF.cv;
  if(!ctx){ CONF.raf = 0; return; }
  ctx.clearRect(0,0,cv.width,cv.height);
  CONF.parts = CONF.parts.filter(function(p){ return p.y < cv.height + 40; });
  CONF.parts.forEach(function(p){
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.hh/2,p.w,p.hh);
    ctx.restore();
  });
  if(CONF.parts.length){ CONF.raf = window.requestAnimationFrame(tickConfetti); }
  else { ctx.clearRect(0,0,cv.width,cv.height); CONF.raf = 0; }
}

/* ---- small sound effects (WebAudio, no files) ---- */
var AC = null;
function beep(kind){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var notes = kind==="ok" ? [660,880] : kind==="win" ? [523,659,784,1047] : [220,180];
    notes.forEach(function(f,i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.value = 0.0001;
      o.connect(g); g.connect(AC.destination);
      var t = AC.currentTime + i*0.09;
      g.gain.exponentialRampToValueAtTime(0.14, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
      o.start(t); o.stop(t+0.24);
    });
  }catch(e){}
}

/* ---- capability wiring (Claude runtime: sample + db) ---- */
var CAP = {sample:null, db:null, ready:false};
function bootCaps(cb){
  if(!(window.claude && window.claude.use)){ CAP.ready = true; cb && cb(); return; }
  var got = 0;
  function done(){ got++; if(got>=2){ CAP.ready = true; cb && cb(); } }
  try{
    window.claude.use("sample").then(function(s){ CAP.sample = s; done(); }, function(){ done(); });
    window.claude.use("db").then(function(d){ CAP.db = d; done(); }, function(){ done(); });
  }catch(e){ CAP.ready = true; cb && cb(); }
}
function shuffle(a){
  var x = a.slice();
  for(var i=x.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=x[i]; x[i]=x[j]; x[j]=t; }
  return x;
}

function Match(p){

/* ---------------------------------------------------------- BINGO */

var BINGO_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function Bingo(p){
  var ex = p.ex;
  var grid = useMemo(function(){ return shuffle(ex.items.map(function(x,i){ return {x:x, i:i}; })).slice(0,9); },[ex]);
  var callOrder = useMemo(function(){ return shuffle(grid.map(function(c){ return c.i; })); },[grid]);
  var B = useState({marked:[], step:0, errs:0, wrong:null, won:false}), b = B[0], setB = B[1];
  var current = b.won ? null : callOrder[b.step];
  var item = current===undefined || current===null ? null : ex.items[current];

  useEffect(function(){
    if(item){ var t = setTimeout(function(){ ttsSpeak(item.clue, 0.85); }, 300); return function(){ clearTimeout(t); }; }
  },[b.step, b.won]);
  useEffect(function(){ return function(){ ttsStop(); }; },[]);

  function tap(pos){
    if(b.won || !item) return;
    var cell = grid[pos];
    if(b.marked.indexOf(pos)>=0) return;
    if(cell.i === current){
      var marked = b.marked.concat([pos]);
      var win = BINGO_LINES.some(function(L){ return L.every(function(k){ return marked.indexOf(k)>=0; }); });
      beep(win?"win":"ok");
      setB({marked:marked, step:b.step+1, errs:b.errs, wrong:null, won:win});
      if(win){ ttsStop(); confetti(140); p.onChange({done:true, errs:b.errs}); }
      else if(b.step+1 >= callOrder.length){ p.onChange({done:true, errs:b.errs}); setB(function(x){ return Object.assign({},x,{won:true}); }); }
    } else {
      beep("no");
      setB(Object.assign({}, b, {wrong:pos, errs:b.errs+1}));
      setTimeout(function(){ setB(function(x){ return Object.assign({},x,{wrong:null}); }); }, 450);
    }
  }

  return h("div",null,

function Sort(p){
  var ex = p.ex;
  var items = useMemo(function(){ return shuffle(ex.items); },[ex]);
  var S = useState({n:0, errs:0, flash:null}), st = S[0], setSt = S[1];
  var done = st.n >= items.length;
  useEffect(function(){ if(done) p.onChange({done:true, errs:st.errs}); },[done]);
  var it = items[st.n];
  function pick(ci){
    if(st.flash!==null || done) return;
    var ok = it.c===ci;
    beep(ok?"ok":"no");
    setSt(Object.assign({}, st, {flash:{ci:ci, ok:ok}, errs: st.errs + (ok?0:1)}));
    setTimeout(function(){ setSt(function(x){ return {n:x.n+1, errs:x.errs, flash:null}; }); }, ok? 420 : 1100);
  }
  return h("div",null,
    h("p",{className:"muted small", style:{marginTop:0}}, ex.q),
    h("div",{className:"xpbar", style:{marginBottom:"12px"}}, h("div",{style:{width:(st.n/items.length*100)+"%"}})),
    done ? h("div",{className:"card pop", style:{textAlign:"center"}},
      h(Mascot,{who:"host", mood:"excited", size:80}), h("b",null,"All sorted!"),
      h("p",{className:"small muted"}, st.errs===0? "Every phrase in the right job." : st.errs+" went to the wrong place - look at them again below."))
    : h("div",null,
        h("div",{className:"card", style:{textAlign:"center", fontSize:"20px", padding:"22px 14px", marginBottom:"14px"}},
          "\u201C"+it.t+"\u201D"),
        h("div",{className:"grid g2"},
          ex.cats.map(function(c, ci){
            var cls = "choice";
            if(st.flash){
              if(ci===it.c) cls += " ok";
              else if(st.flash.ci===ci) cls += " no shake";
            }
            return h("button",{key:ci, className:cls, style:{justifyContent:"center", textAlign:"center", minHeight:"74px"},
              onClick:function(){ pick(ci); }}, c);
          })),
        st.flash && !st.flash.ok ? h("p",{className:"small muted", style:{marginTop:"10px"}},
          "That one belongs in: ", h("b",null, ex.cats[it.c])) : null)
  );
}

/* ---------------------------------------------------------- LESSON SCREEN */

function isCorrect(ex, v){
  if(v===null || v===undefined) return false;
  if(ex.t==="mcq" || ex.t==="listen") return v===ex.a;
  if(ex.t==="gap") return v===ex.a;
  if(ex.t==="speak") return !!(v && v.score>=60);
  if(ex.t==="match" || ex.t==="bingo" || ex.t==="sort" || ex.t==="menu") return !!(v && v.done);
  if(ex.t==="order") return !!(v && v.length===ex.lines.length && v.every(function(o,n){ return o.i===n; }));
  return false;
}
function answerText(ex){
  if(ex.t==="mcq"||ex.t==="listen") return ex.opts[ex.a];
  if(ex.t==="gap") return ex.q.replace("___", ex.a.toUpperCase());
  if(ex.t==="order") return ex.lines.join("  \u2192  ");
  return "";
}
var PRAISE = ["Nice one!","That is it!","Perfect service!","Exactly right!","Beautiful!","Chef is proud!","You are on fire!"];
var SOFT = ["Almost - look again.","Not this time.","Close! Here is the good one.","Let us fix that."];

function LessonScreen(p){
  var L = p.lesson;
  var q0 = useMemo(function(){ return L.ex.map(function(e,i){ return {ex:e, key:L.id+"-"+i, retry:false}; }); },[L]);
  var Q = useState(q0), queue = Q[0], setQueue = Q[1];
  var I = useState(0), i = I[0], setI = I[1];
  var V = useState(null), val = V[0], setVal = V[1];
  var LK = useState(false), locked = LK[0], setLocked = LK[1];
  var SC = useState({right:0, asked:0, xp:0, slips:0}), sc = SC[0], setSc = SC[1];
  var msg = useRef("");
  var flags = useRef({});

  var item = queue[i];
  useEffect(function(){ setVal(null); setLocked(false); },[i]);
  useEffect(function(){ return function(){ ttsStop(); }; },[]);

  if(!item) return null;
  var ex = item.ex;
  var good = locked ? isCorrect(ex,val) : false;

  function check(){
    var ok = isCorrect(ex,val);
    if(ok && ex.t==="bingo") flags.current.bingo = true;
    if(ok && ex.t==="menu") flags.current.menu = true;
    msg.current = ok ? PRAISE[(Math.random()*PRAISE.length)|0] : SOFT[(Math.random()*SOFT.length)|0];
    var gain = ok ? (item.retry ? 4 : (ex.t==="speak" && val && val.score>=85 ? 14 : 10)) : 0;
    setSc({right:sc.right+(ok?1:0), asked:sc.asked+1, xp:sc.xp+gain, slips:sc.slips+(ok?0:1)});
    setLocked(true);
    beep(ok?"ok":"no");
  }
  function next(){
    var ok = isCorrect(ex,val);
    var nq = queue;
    if(!ok && !item.retry){
      nq = queue.concat([{ex:ex, key:item.key+"-r", retry:true}]);
      setQueue(nq);
    }
    if(i+1 >= nq.length){
      p.onFinish({xp:sc.xp, right:sc.right, asked:sc.asked, slips:sc.slips, perfect: sc.slips===0, flags: flags.current});
    } else { setI(i+1); }
  }

  var canCheck = val!==null && val!==undefined && !(ex.t==="order" && val.length!==ex.lines.length);
  var pct = (i/queue.length)*100;
  var mood = !locked ? "happy" : (good ? "excited" : (item.retry ? "menace" : "sad"));

  var body;
  if(ex.t==="mcq") body = h(MCQ,{ex:ex, value:val, locked:locked, onChange:setVal});
  else if(ex.t==="gap") body = h(Gap,{ex:ex, value:val, locked:locked, onChange:setVal});
  else if(ex.t==="listen") body = h(Listen,{ex:ex, value:val, locked:locked, onChange:setVal});
  else if(ex.t==="speak") body = h(Speak,{ex:ex, value:val, locked:locked, onChange:setVal});
  else if(ex.t==="match") body = h(Match,{ex:ex, value:val, locked:locked, onChange:function(v){ setVal(v); }});
  else if(ex.t==="order") body = h(Order,{ex:ex, value:val, locked:locked, onChange:setVal});
  else if(ex.t==="bingo") body = h(Bingo,{ex:ex, value:val, locked:locked, onChange:setVal});
  else if(ex.t==="sort") body = h(Sort,{ex:ex, value:val, locked:locked, onChange:setVal});
  else if(ex.t==="menu") body = h(MenuTask,{ex:ex, value:val, locked:locked, onChange:setVal});

  var TITLES = {mcq:"Choose the right answer", gap:"Complete the sentence", listen:"Listen and answer",
                speak:"Say it like a pro", match:"Match the pairs", order:"Put the service in order",
                bingo:"Restaurant bingo", sort:"Which job does it do?", menu:"Write your own menu"};

  return h("div",null,
    h("div",{className:"topbar noprint"},
      h("div",{className:"inner"},
        h("button",{className:"btn tiny ghost", onClick:function(){ ttsStop(); p.onExit(); }, "aria-label":"Leave lesson"},"\u2715"),
        h(Bar,{pct:pct, col:"var(--green)"}),
        h("span",{className:"stat"},"\u2764\uFE0F ", h("span",{className:"num"}, Math.max(0,5-sc.slips)))
      )),
    h("div",{className:"wrap"},
      h("h2",{style:{margin:"22px 0 4px"}}, TITLES[ex.t]||"Exercise"),
      h("p",{className:"muted small", style:{marginTop:0}}, L.title+" \u00B7 "+(i+1)+" / "+queue.length),
      (ex.scene || MEDIA[ex.m]) ? h("div",{style:{margin:"12px 0 16px"}}, h(MediaSlot,{mkey:ex.m, scene:ex.scene})) : null,
      ex.q && ex.t!=="match" && ex.t!=="order" ? h("div",{className:"row", style:{alignItems:"flex-start", margin:"0 0 16px", gap:"14px"}},
        h(Mascot,{who:L.who, mood:mood, size:74, className:"bounce"}),
        h("div",{className:"speech", style:{flex:1}}, h("b",{style:{fontSize:"19px"}}, ex.q))
      ) : null,
      body,
      h("div",{style:{height:"40px"}})
    ),
    h("div",{className:"footerbar"},
      locked ? h("div",{className:"verdict "+(good?"ok":"no")},
        h("div",{className:"row"},
          h(Mascot,{who:L.who, mood:mood, size:56}),
          h("div",null,
            h("b",{style:{fontFamily:"Fredoka", fontSize:"20px"}}, good? "\u2705 "+msg.current : "\u274C "+msg.current),
            !good && answerText(ex) ? h("div",{className:"small"},"Answer: ", h("b",null,answerText(ex))) : null,
            ex.why ? h("div",{className:"small muted"}, ex.why) : null
          ))) : null,
      h("div",{className:"inner"},
        locked
          ? h("button",{className:"btn big "+(good?"green":"tomato"), onClick:next}, "Continue \u2192")
          : h("button",{className:"btn big green", disabled:!canCheck, onClick:check}, (ex.t==="match"?"Finish the pairs": ex.t==="bingo"?"Play to bingo": ex.t==="sort"?"Sort them all": ex.t==="menu"?"Check":"Check"))
      ))
  );
}

function AIPractice(p){

      "Topic of this lesson: "+p.lesson.title+" ("+p.lesson.it+").\n"+

      "Reply with ONLY a JSON array, one object per question: "+
      '[{"q":"situation + question in English","opts":["a","b","c","d"],"a":0,"why":"one short line, may mention the Italian"}]';

  return h("div",{className:"aibox noprint", style:{marginTop:"16px"}},

      var chosen = st.pick[qi];

          return h("button",{key:oi, className:cls, onClick:function(){
            if(chosen!==undefined) return;

function PathScreen(p){
  var st = p.st;
  var order = LESSONS.slice();
  function unlocked(idx){
    if(idx===0) return true;
    return !!st.done[order[idx-1].id];
  }
  var allDone = order.every(function(L){ return !!st.done[L.id]; });
  var firstOpen = -1;
  for(var k=0;k<order.length;k++){ if(!st.done[order[k].id] && unlocked(k)){ firstOpen = k; break; } }

  var rows = [], lastUnit = 0;
  order.forEach(function(L, idx){
    if(L.unit !== lastUnit){
      lastUnit = L.unit;
      var U = UNITS[L.unit];
      rows.push(h("div",{key:"u"+L.unit, className:"unitbar", style:{background:U.col}},
        h("div",{style:{flex:1}}, h("b",{style:{fontFamily:"Fredoka", fontSize:"20px"}}, U.name),
          h("div",{style:{fontSize:"14px", opacity:.9}}, U.it)),
        h(Mascot,{who: L.unit===2?"chef":(L.unit===3?"host":"waitress"), mood:"happy", size:56})));
    }
    var open = unlocked(idx), done = st.done[L.id];
    var off = [0,60,90,60,0,-60,-90,-60][idx % 8];
    rows.push(
      h("div",{key:L.id, className:"nodewrap", style:{transform:"translateX("+(off/2)+"px)"}},
        h("div",{style:{position:"relative"}},
          idx===firstOpen ? h("div",{className:"startflag"}, done? "REVIEW" : "START") : null,
          h("button",{className:"node"+(open?"":" locked")+(idx===firstOpen?" bounce":""),
            style:{"--ncol":"var(--"+L.col+")", "--nedge":"var(--"+L.col+"-edge)"},
            onClick:function(){ if(open) p.onOpen(L); },
            "aria-label":L.title+(open?"":" (locked)")},
            h("span",{className:"emoji"}, open? L.icon : "\uD83D\uDD12"),
            done ? h("span",{className:"crowns"}, "\u2B50 "+done.crowns) : null)),
        h("div",{className:"nodelabel"}, h("b",null, L.title), L.it)

  rows.push(h("div",{key:"boss", className:"nodewrap", style:{marginTop:"10px"}},
    h("button",{className:"node"+(allDone?"":" locked")+(allDone?" pulse":""),
      style:{"--ncol":"var(--yellow)", "--nedge":"var(--yellow-edge)", width:"104px", height:"98px"},
      onClick:function(){ if(allDone) p.onBoss(); }, "aria-label":"Boss level"},
      h("span",{className:"emoji"}, allDone? "\uD83D\uDC51" : "\uD83D\uDD12")),
    h("div",{className:"nodelabel"}, h("b",null,"Boss level: the full service"),
      allDone? "A demanding guest is waiting at table nine. Serve them in English." : "Finish all ten lessons to unlock.")));

  return h("div",{className:"wrap"},
    h("div",{className:"card", style:{marginTop:"18px", borderColor:"var(--green)", background:"var(--bg-2)"}},
      h("div",{className:"row"},
        h(Mascot,{who:"waitress", mood: st.streak>0 ? "excited":"happy", size:84}),
        h("div",{style:{flex:1}},
          h("b",{style:{fontFamily:"Fredoka", fontSize:"20px"}}, st.name? "Welcome back, "+st.name+"!" : "Welcome to your shift!"),
          h("p",{className:"small", style:{margin:"4px 0 8px"}},
            st.streak>0 ? "Day "+st.streak+" of your streak. Ten minutes today keeps it alive."
                        : "Finish one lesson today to start your streak."),
          h("div",{className:"row"},
            h("div",{style:{flex:1}}, h(Bar,{pct: (Object.keys(st.done).length/LESSONS.length)*100})),
            h("span",{className:"small muted"}, Object.keys(st.done).length+"/"+LESSONS.length))))),

function snapRows(snap){
  var out = [];
  var list = (snap && (snap.docs || snap.documents)) || (Array.isArray(snap)? snap : []);
  for(var i=0;i<list.length;i++){
    var d = list[i];
    var data = (d && typeof d.data === "function") ? d.data() : (d && d.data) || d;
    if(data && data.name) out.push({name:String(data.name).slice(0,24), xp:Number(data.xp)||0});
  }
  return out;
}
function LeagueScreen(p){

var BOSS_RULES =
 "ROLE-PLAY. You are a restaurant GUEST in an English-speaking restaurant. The person writing to you is an ITALIAN waiter practising service English at CEFR B1.\n"+
 "Rules: stay in character as the guest; never break role; never write in Italian. Keep each reply SHORT (1-3 sentences), natural and spoken.\n"+
 "You are demanding but polite: you ask about ingredients, you have a nut allergy, you change your drink order once, you ask for a recommendation, and at the end you ask for the bill and whether service is included.\n"+
 "Move the meal forward one step per turn: greeting -> drinks -> starter -> main -> problem with the dish -> dessert/coffee -> the bill -> goodbye.\n"+
 "If the waiter's English is unclear, ask them to repeat, as a real guest would. Never correct their grammar during the role-play.\n"+
 "Start now: you have just sat down at table nine.";

function BossScreen(p){
  var T = useState([]), turns = T[0], setTurns = T[1];
  var In = useState(""), input = In[0], setInput = In[1];
  var B = useState({busy:false, err:"", done:null}), bs = B[0], setBs = B[1];

  if(!CAP.sample) return h(OfflineBoss,{onExit:p.onExit, onWin:p.onWin});

  function send(text){
    if(!text.trim() || bs.busy) return;
    var mine = turns.concat([{role:"user", content:text.trim()}]);
    setTurns(mine); setInput(""); setBs({busy:true, err:"", done:null});
    var msgs = [{role:"user", content:BOSS_RULES}].concat(mine);

      setTurns(mine.concat([{role:"assistant", content:res.text}]));
      setBs({busy:false, err:"", done:null});
    }).catch(function(e){
      setBs({busy:false, err: e && e.code==="rate_limited" ? "Too many messages at once - wait a moment." : "The guest went quiet. Try sending that again.", done:null});
    });

    var prompt = "You are an English teacher assessing an Italian waiter's service English (CEFR B1) from this role-play transcript.\n\n"+
      script+"\n\nReply with ONLY this JSON: "+

    CAP.sample.json(prompt, {modelTier:"default"}).then(function(d){
      var sc = Math.max(0, Math.min(100, Number(d && d.score)||60));

  return h("div",null,
    h("div",{className:"topbar noprint"}, h("div",{className:"inner"},
      h("button",{className:"btn tiny ghost", onClick:p.onExit},"\u2715"),
      h("b",{style:{fontFamily:"Fredoka"}},"Table nine \u00B7 live service"),
      h("span",{className:"stat", style:{marginLeft:"auto"}}, "\uD83D\uDCAC ", h("span",{className:"num"}, turns.filter(function(t){return t.role==="user";}).length)))),
    h("div",{className:"wrap"},
      h("div",{className:"card", style:{marginTop:"16px", background:"var(--bg-2)"}},
        h("div",{className:"row"},
          h(Mascot,{who:"chef", mood:"menace", size:80}),
          h("div",null, h("b",null,"Your shift starts now."),
            h("p",{className:"small", style:{margin:"4px 0 0"}},"Greet the guest, take the order, handle the problem, bring the bill. Write in English. When the meal is over, tap Finish the service for your report card.")))),
      h("div",{ref:boxRef, className:"card", style:{marginTop:"14px", maxHeight:"52vh", overflowY:"auto"}},
        turns.length===0 ? h("p",{className:"muted"},"Say hello to start the service. For example: Good evening, welcome to Trattoria Da Nonna.") : null,
        turns.map(function(t,n){
          return h("div",{key:n, className:"bubble "+(t.role==="user"?"me":"guest")},
            h("div",{className:"small muted"}, t.role==="user"? "You (waiter)" : "Guest"),
            t.content);
        }),
        bs.busy && !bs.done ? h("div",{className:"bubble guest"}, h("span",{className:"muted"},"The guest is thinking...")) : null),
      bs.err ? h("p",{style:{color:"var(--rose)"}}, bs.err) : null,
      bs.done ? h("div",{className:"card pop", style:{marginTop:"14px", borderColor:"var(--yellow)"}},
        h("h2",null,"Report card: ", h("span",{style:{color:"var(--green)"}}, bs.done.score+"/100")),

        bs.done.phrase ? h("p",{className:"card", style:{background:"var(--bg-2)"}}, "\u2B50 Steal this phrase: ", h("b",null, bs.done.phrase)) : null,
        h("button",{className:"btn big green", style:{marginTop:"10px"}, onClick:p.onExit},"Back to the path \u2192")
      ) : null,

      h("button",{className:"btn green", disabled:bs.busy || !input.trim(), onClick:function(){ send(input); }},"Send"),

          h("tbody",null, L.phrases.map(function(x,n){
            return h("tr",{key:n},
              h("td",null, x.en), h("td",null, x.it),
              h("td",{className:"noprint"}, h("button",{className:"btn tiny sky", onClick:function(){ ttsSpeak(x.en, 0.85); }},"\uD83D\uDD0A")));
          }))));
    }),
    h("div",{className:"card noprint", style:{marginTop:"20px", borderColor:"var(--grape)"}},
      h("button",{className:"btn tiny grape", onClick:function(){ setShowKey(!showKey); }},
        showKey? "Hide teacher answer key" : "\uD83D\uDD11 Teacher answer key"),
      showKey ? h("div",{className:"answerkey", style:{marginTop:"12px"}},
        LESSONS.map(function(L){
          return h("div",{key:L.id, style:{marginBottom:"12px"}},
            h("b",null, L.title),
            L.ex.map(function(ex,n){
              var a = ex.t==="match" ? ex.pairs.map(function(pr){ return pr[0]+" = "+pr[1]; }).join("; ")
                    : ex.t==="speak" ? ex.say : answerText(ex);
              return h("div",{key:n, className:"small muted"}, (n+1)+". "+a);
            }));
        })) : null),
    h("div",{style:{height:"40px"}})
  );
}

/* ---------------------------------------------------------- BADGES + PROGRESS RULES */

function computeBadges(st){
  var have = st.badges.slice(), add = [];
  function give(id){ if(have.indexOf(id)<0){ have.push(id); add.push(id); } }
  var doneIds = Object.keys(st.done);
  if(doneIds.length>=1) give("first");
  var anyPerfect = doneIds.some(function(k){ return st.done[k].best===100; });
  if(anyPerfect) give("perfect");
  if(st.streak>=3) give("streak3");
  if(st.streak>=7) give("streak7");
  if(st.heard>=10) give("ear");
  if(st.spoken>=10) give("voice");
  if(st.bingoWon) give("bingo");
  if(st.menuSent) give("menu");
  [1,2,3,4].forEach(function(u){
    var all = LESSONS.filter(function(L){ return L.unit===u; }).every(function(L){ return !!st.done[L.id]; });
    if(all) give("unit"+u);
  });
  if(levelFor(st.xp)>=5) give("lvl5");
  if(st.xp>=1000) give("xp1000");
  if(st.bossWon) give("boss");
  st.badges = have;
  return add.map(function(id){ for(var i=0;i<BADGES.length;i++){ if(BADGES[i].id===id) return BADGES[i]; } return null; }).filter(Boolean);
}

function pushScore(st){
  if(!CAP.db || !st.name) return;
  try{
    var id = st.pid || ("p"+Math.random().toString(36).slice(2,10));
    st.pid = id;
    CAP.db.doc("leaderboard/"+id).set({name:st.name, xp:st.xp, level:levelFor(st.xp), at:Date.now()});
  }catch(e){}
}

/* ---------------------------------------------------------- APP ROOT */

function App(){
  var S = useState(loadState), st = S[0], setSt = S[1];
  var SC = useState({name:"path"}), scr = SC[0], setScr = SC[1];
  var C = useState(0), caps = C[0], setCaps = C[1];

  useEffect(function(){
    initVoices(function(){});
    bootCaps(function(){ setCaps(function(x){ return x+1; }); });
  },[]);
  useEffect(function(){ saveState(st); },[st]);

  function update(fn){
    setSt(function(old){
      var n = JSON.parse(JSON.stringify(old));
      fn(n);
      return n;
    });
  }
  function addXP(n){ update(function(s2){ s2.xp += n; computeBadges(s2); pushScore(s2); }); }

  function finishLesson(L, r){
    var acc = r.asked ? Math.round(r.right/r.asked*100) : 100;
    var bonus = 20 + (r.perfect? 15 : 0);
    var total = r.xp + bonus;
    var fresh = [];
    update(function(s2){
      s2.xp += total;
      var prev = s2.done[L.id];
      s2.done[L.id] = {best: Math.max(acc, prev? prev.best:0), crowns: Math.min(3, (prev? prev.crowns:0)+1)};
      var t = todayKey();
      if(s2.lastDay !== t){
        s2.streak = (s2.lastDay === yesterdayKey()) ? (s2.streak+1) : 1;
        s2.lastDay = t;
      }
      L.ex.forEach(function(e){ if(e.t==="listen") s2.heard++; if(e.t==="speak") s2.spoken++; });
      if(r.flags && r.flags.bingo) s2.bingoWon = true;
      if(r.flags && r.flags.menu) s2.menuSent = true;
      fresh = computeBadges(s2);
      pushScore(s2);
    });
    setScr({name:"result", lesson:L, result:r, totalXP:total, newBadges:fresh});
  }

  var lv = levelFor(st.xp);
  var nav = [["path","\uD83D\uDDFA","Path"],["league","\uD83C\uDFC6","League"],["book","\uD83D\uDCD6","Phrasebook"],["me","\uD83D\uDC64","You"]];

  if(scr.name==="lesson")
    return h(LessonScreen,{lesson:scr.lesson, onExit:function(){ setScr({name:"path"}); },
      onFinish:function(r){ finishLesson(scr.lesson, r); }});

  if(scr.name==="result")
    return h(ResultScreen,{lesson:scr.lesson, result:scr.result, totalXP:scr.totalXP, newBadges:scr.newBadges,
      onXP:addXP, onDone:function(){ setScr({name:"path"}); }});

  if(scr.name==="boss")
    return h(BossScreen,{onExit:function(){ setScr({name:"path"}); },
      onWin:function(sc){ update(function(s2){ s2.bossWon = true; s2.xp += 60 + Math.round(sc/2); computeBadges(s2); pushScore(s2); }); }});

  var page;
  if(scr.name==="league") page = h(LeagueScreen,{st:st, onName:function(n){ update(function(s2){ s2.name = n; pushScore(s2); }); }});
  else if(scr.name==="book") page = h(Phrasebook,null);
  else if(scr.name==="me") page = h(ProfileScreen,{st:st,
    onName:function(n){ update(function(s2){ s2.name = n; pushScore(s2); }); },
    onReset:function(){ setSt(blankState()); }});
  else page = h(PathScreen,{st:st, onOpen:function(L){ setScr({name:"lesson", lesson:L}); }, onBoss:function(){ setScr({name:"boss"}); }});

  return h("div",null,
    h("div",{className:"topbar noprint"},
      h("div",{className:"inner"},
        h("button",{className:"wordmark", onClick:function(){ setScr({name:"path"}); }, "aria-label":"TAVOLA home"}, h(Wordmark,{size:30})),
        h("span",{className:"stat", title:"streak"},"\uD83D\uDD25 ", h("span",{className:"num"}, st.streak)),
        h("span",{className:"stat", title:"experience"},"\u26A1 ", h("span",{className:"num"}, st.xp)),
        h("span",{className:"stat", title:"level"},"\u2B50 ", h("span",{className:"num"}, lv))
      )),
    page,
    h("div",{className:"footerbar noprint"},
      h("div",{className:"inner", style:{justifyContent:"space-around"}},
        nav.map(function(n){
          var on = (scr.name===n[0]) || (scr.name==="path" && n[0]==="path");
          return h("button",{key:n[0], className:"btn tiny"+(on?" green":" ghost"), onClick:function(){ setScr({name:n[0]}); }},
            h("span",{style:{fontSize:"18px"}}, n[1]), h("span",{className:"small"}, n[2]));
        })))
  );
}

var rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(h(App,null));
window.addEventListener("resize", function(){
  var cv = document.getElementById("confetti");
  if(cv){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
});
})();

</script>
